<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebFlux Task Manager</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="container">
    <header>
        <h1>WebFlux Task Manager</h1>
        <span id="live" class="live off" title="Conexión Server-Sent Events">● en directo</span>
    </header>

    <form id="taskForm" autocomplete="off">
        <input type="hidden" id="editHref">
        <input type="text" id="taskTitle" placeholder="Título" maxlength="120" required>
        <textarea id="taskDescription" placeholder="Descripción (opcional)" maxlength="2000"></textarea>
        <div class="row">
            <input type="date" id="taskDueDate" required>
            <select id="taskStatus">
                <option value="PENDING">Pendiente</option>
                <option value="IN_PROGRESS">En curso</option>
                <option value="COMPLETED">Hecha</option>
            </select>
        </div>
        <div class="row">
            <button type="submit" id="submitBtn">Añadir tarea</button>
            <button type="button" id="cancelBtn" class="secondary" hidden>Cancelar</button>
        </div>
        <p id="formError" class="error" role="alert"></p>
    </form>

    <nav class="filters" aria-label="Filtrar por estado">
        <button class="chip active" data-status="">Todas</button>
        <button class="chip" data-status="PENDING">Pendientes</button>
        <button class="chip" data-status="IN_PROGRESS">En curso</button>
        <button class="chip" data-status="COMPLETED">Hechas</button>
    </nav>

    <ul id="taskList"></ul>
    <p class="hint">Abre esta página en dos ventanas: lo que cambies en una aparece en la otra al instante.
        Usuarios de demo: <code>user/user</code> (lee, crea y edita) y <code>admin/admin</code> (además borra).
        API: <a href="/swagger-ui.html">Swagger UI</a>.</p>
</main>
<div id="toast" class="toast" role="status"></div>
<script src="/js/script.js"></script>
</body>
</html>
