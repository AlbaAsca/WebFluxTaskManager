<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tareas</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="container">
    <h1>Gestión de Tareas</h1>

    <!-- Formulario para crear una nueva tarea -->
    <form id="taskForm">
        <input type="text" id="taskTitle" placeholder="Título de la tarea" required>
        <textarea id="taskDescription" placeholder="Descripción de la tarea" required></textarea>
        <input type="date" id="taskDueDate" required>
        <button type="button" onclick="addTask()">Agregar Tarea</button>
    </form>

    <!-- Lista de tareas -->
    <h2>Mis Tareas</h2>
    <ul id="taskList">
        <!-- Las tareas se agregarán dinámicamente aquí -->
    </ul>
</div>

<!-- Enlace al archivo externo JavaScript -->
<script src="/js/script.js"></script>

</body>
</html>
