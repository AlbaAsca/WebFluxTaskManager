<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management</title>
    <link rel="stylesheet" href="/css/styles.css"> <!-- External CSS link -->
</head>
<body>

<!-- Main container -->
<div class="container">
    <h1>Task Management</h1>

    <!-- Task form for adding or editing a task -->
    <form id="taskForm">
        <!-- Hidden field for task ID when editing -->
        <input type="hidden" id="taskId">

        <!-- Task title input -->
        <input type="text" id="taskTitle" placeholder="Task Title" required>

        <!-- Task description input -->
        <textarea id="taskDescription" placeholder="Task Description" required></textarea>

        <!-- Task due date input -->
        <input type="date" id="taskDueDate" required>

        <!-- Task status select -->
        <select id="taskStatus">
            <option value="PENDING">Pending</option>
            <option value="COMPLETED">Completed</option>
        </select>

        <!-- Action buttons -->
        <button type="button" id="addTaskBtn" onclick="addTask()">Add Task</button>
        <button type="button" id="editTaskBtn" style="display: none;" onclick="saveTask()">Save Changes</button>
    </form>

    <!-- Task list -->
    <h2>My Tasks</h2>
    <ul id="taskList">
        <!-- Dynamically added tasks will appear here -->
    </ul>
</div>

<!-- External JavaScript link -->
<script src="/js/script.js"></script>

</body>
</html>
