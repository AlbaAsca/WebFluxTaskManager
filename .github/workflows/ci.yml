name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests (unitarios + integración con MongoDB en Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B verify
      - name: Resumen de tests
        if: always()
        run: |
          echo "### Tests" >> $GITHUB_STEP_SUMMARY
          grep -h "<testsuite " target/surefire-reports/*.xml | sed -E 's/.*name="([^"]+)".*tests="([0-9]+)".*skipped="([0-9]+)".*failures="([0-9]+)".*errors="([0-9]+)".*/- \1: \2 tests, \3 skipped, \4 failures, \5 errors/' >> $GITHUB_STEP_SUMMARY

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t webflux-task-manager .
